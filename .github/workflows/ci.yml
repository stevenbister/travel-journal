name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install playwright deps
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint --affected

      - name: TypeCheck
        run: pnpm typecheck --affected

      - name: Create API .env for tests
        run: |
          {
            echo "BETTER_AUTH_URL=${BETTER_AUTH_URL:-localhost:5174}"
            echo "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-test-secret-at-least-32-chars-long-1234}"
            echo "BETTER_AUTH_OAUTH_PROXY_SECRET=${BETTER_AUTH_OAUTH_PROXY_SECRET:-test-secret-at-least-32-chars-long-1234}"
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-test-google-client-id}"
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-test-google-client-secret}"
          } > apps/api/.env

      - name: Test
        run: pnpm test --affected
