<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Travel Journal</title>
        <meta name="description" content="A place to document your travels." />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/favicon-light.svg"
            media="(prefers-color-scheme: light)"
        />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/favicon-dark.svg"
            media="(prefers-color-scheme: dark)"
        />
        <link
            rel="apple-touch-icon"
            href="/icon-light-180x180.png"
            sizes="180x180"
            media="(prefers-color-scheme: light)"
        />
        <link
            rel="apple-touch-icon"
            href="/icon-dark-180x180.png"
            sizes="180x180"
            media="(prefers-color-scheme: dark)"
        />
        <meta
            name="theme-color"
            content="#f7f2e9"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#15140f"
            media="(prefers-color-scheme: dark)"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
